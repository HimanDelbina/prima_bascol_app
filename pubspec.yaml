name: prima_bascol_app
description: "سامانه هوشمند مدیریت باسکول پریما - کلاینت رسمی"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Persian Calendar & Date Formats
  shamsi_date: ^1.1.0
  persian_datetime_picker: ^3.1.0
  intl: ^0.20.2

  # Typography & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

